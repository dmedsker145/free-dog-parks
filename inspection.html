<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunnie's Park Inspections</title><style>body{font:17px system-ui;margin:0;background:#f1f8f5;color:#193b34}header{background:#087665;color:white;padding:20px}main{max-width:700px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #1232}h1{font-size:24px;margin:0}h2{font-size:21px}fieldset{border:0;border-bottom:1px solid #eee;padding:15px 0;margin:0}legend{font-weight:700;margin-bottom:8px}.choices{display:flex;flex-wrap:wrap;gap:9px}label.choice{display:inline-flex;align-items:center;border:2px solid #b7d4cb;border-radius:30px;padding:12px;min-height:24px;cursor:pointer}label.choice:has(input:checked){background:#087665;color:white;border-color:#087665}input[type=radio],input[type=checkbox]{accent-color:#087665;margin-right:7px}input[type=text],textarea{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #a9c8bf;border-radius:9px}textarea{min-height:80px}button{background:#087665;color:white;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;margin:8px 5px 8px 0}.secondary{background:#dceee7;color:#124b40}.hide{display:none}small{color:#506b61}</style><header><h1>🐾 Sunnie's Dog Park Inspections</h1>Tap choices • Save each section • No typing required</header><main><section><strong>Park</strong><input id="park" type="text" value="Garden City Dog Park"><p><strong>Location</strong><input id="location" type="text" value="Garden City, Kansas"></p><small id="saved">Changes save automatically on this device.</small></section><div id="steps"></div><section><button class="secondary" id="prev">← Back</button><button id="next">Save & Continue →</button></section><section id="finish" class="hide"><h2>Inspection saved! 🐶</h2><p id="favorite"></p><button id="download">Download inspection record</button><button class="secondary" id="copy">Copy record</button><button class="secondary" id="new">New inspection</button></section></main><script>
const groups=[
["1 of 4 — Basic Information",[["Admission","Free","Paid","Unknown"],["Fencing","Fully fenced","Partially fenced","Unfenced","Unknown"],["Dog areas","Separate small / large","Shared","Unknown"],["Double-gated entry","Yes","No","Unknown"],["Safety","Safe","Concerns","Unknown"],["Surface","Grass","Gravel","Mulch","Dirt","Sand","Mixed","Unknown"]]],
["2 of 4 — Amenities (tap everything verified)",[["Poop bags","Present","Absent","Unknown"],["Trash cans","Present","Absent","Unknown"],["Drinking water","Both areas","Large dog only","Small dog only","Present, location unknown","Absent","Unknown"],["Water bowls","Present","Absent","Unknown"],["Benches","Present","Absent","Unknown"],["Shade","Plenty","Limited","None","Unknown"],["Picnic tables","Both areas","Large dog only","Small dog only","Absent","Unknown"],["Lighting","Good","Minimal","None","Unknown"],["Agility obstacles","Both areas","Large dog only","Small dog only","Absent","Unknown"],["Toys","Present","Absent","Unknown"],["Restrooms","Present","Nearby","Absent","Unknown"]]],
["3 of 4 — Parking & Accessibility",[["Parking","Dedicated lot","Shared lot","Street only","Other","Unknown"],["Largest vehicle","Car / SUV","Class B RV","Class C RV","Class A RV","Semi","Unknown"],["Parking spaces","Plenty","Limited","Very limited","Unknown"],["Wheelchair access","Accessible","Not accessible","Unknown"],["Walk to entrance","At parking","Short walk","Long walk","Unknown"],["Cell service","Excellent","Good","Fair","Poor","None","Unknown"]]],
["4 of 4 — Final Evaluation",[["Maintenance","Excellent","Good","Fair","Poor","Unknown"],["Sunnie's rating","1","1.5","2","2.5","3","3.5","4","4.5","4.8","5"],["Recommend","Yes","No","Unsure"],["Photos","Will upload later","None","Uploaded separately"]]]
];
let step=0;const storeKey="sunnie-park-inspection-v4";const root=document.getElementById("steps");groups.forEach(([title,questions],i)=>{const sec=document.createElement("section");sec.id="step"+i;sec.innerHTML="<h2>"+title+"</h2>";questions.forEach(([question,...options])=>{const fs=document.createElement("fieldset"),legend=document.createElement("legend");legend.textContent=question;fs.append(legend);const box=document.createElement("div");box.className="choices";options.forEach(opt=>{const label=document.createElement("label");label.className="choice";const input=document.createElement("input");input.type="radio";input.name="q"+i+"_"+question;input.value=opt;label.append(input,document.createTextNode(opt));box.append(label)});fs.append(box);sec.append(fs)});const notes=document.createElement("textarea");notes.placeholder="Optional notes (leave blank if none)";notes.id="notes"+i;sec.append(notes);root.append(sec)});
function record(){const d={park:document.getElementById("park").value,location:document.getElementById("location").value,sections:{},updated:new Date().toISOString()};groups.forEach(([title,questions],i)=>{d.sections[title]={};questions.forEach(([q])=>{const selected=document.querySelector('input[name="q'+i+'_'+q+'"]:checked');d.sections[title][q]=selected?selected.value:"Unknown"});d.sections[title].notes=document.getElementById("notes"+i).value});d.sunnies_favorite=Number(d.sections[groups[3][0]]["Sunnie's rating"])>=4.5;return d}
function save(){try{localStorage.setItem(storeKey,JSON.stringify({step,data:record()}));document.getElementById("saved").textContent="✓ Saved automatically"}catch(e){document.getElementById("saved").textContent="Use Download to keep a copy."}}
function show(){groups.forEach((_,i)=>document.getElementById("step"+i).classList.toggle("hide",i!==step));document.getElementById("prev").style.display=step===0?"none":"inline-block";document.getElementById("next").textContent=step===3?"Finish inspection ✓":"Save & Continue →"}
document.getElementById("next").onclick=()=>{save();if(step<3){step++;show();save();window.scrollTo(0,0)}else{document.getElementById("finish").classList.remove("hide");document.getElementById("favorite").textContent=record().sunnies_favorite?"⭐ Sunnie's Favorite!":"";document.getElementById("finish").scrollIntoView()}};document.getElementById("prev").onclick=()=>{step--;show();save()};document.addEventListener("change",save);document.addEventListener("input",save);
document.getElementById("download").onclick=()=>{const blob=new Blob([JSON.stringify(record(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sunnie-park-inspection.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(JSON.stringify(record(),null,2)).then(()=>alert("Copied!")).catch(()=>alert("Use Download instead."))};
document.getElementById("new").onclick=()=>{if(confirm("Start another inspection? Download the current record first.")){localStorage.removeItem(storeKey);location.reload()}};
try{const old=JSON.parse(localStorage.getItem(storeKey));if(old){step=Math.min(old.step||0,3);document.getElementById("park").value=old.data.park;document.getElementById("location").value=old.data.location;groups.forEach(([title,qs],i)=>{qs.forEach(([q])=>{const value=old.data.sections[title]?.[q];[...document.querySelectorAll('input[name="q'+i+'_'+q+'"]')].forEach(x=>x.checked=x.value===value)});document.getElementById("notes"+i).value=old.data.sections[title]?.notes||""})}}catch(e){}
show();save();</script></html>
