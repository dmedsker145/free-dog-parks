<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Dog Parks</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
}

header {
    background: white;
    padding: 14px 18px 12px;
    border-bottom: 1px solid #ddd;
}

h1 {
    margin: 0;
    color: #217a32;
    font-size: 25px;
}

.subtitle {
    color: #666;
    font-size: 13px;
    margin-top: 3px;
}

.filters {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    overflow-x: auto;
}

.filter {
    border: 1px solid #bbb;
    border-radius: 20px;
    padding: 7px 13px;
    background: white;
    white-space: nowrap;
    font-weight: 600;
    cursor: pointer;
}

.filter.active {
    background: #217a32;
    color: white;
    border-color: #217a32;
}

.search-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.search-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 14px;
}

.search-row button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #217a32;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
#map {
    height: calc(100vh - 120px);
    width: 100%;
}

.legend {
    position: absolute;
    right: 15px;
    top: 140px;
    z-index: 1000;
    background: white;
    padding: 10px 13px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    font-size: 13px;
}

.legend div {
    margin: 4px 0;
}

.dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 7px;
}

.green { background: #218a3a; }
.yellow { background: #e2a520; }
.red { background: #cf3f3f; }

.park-name {
    font-size: 17px;
    font-weight: bold;
}

.status {
    font-weight: bold;
}

.directions {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    background: #217a32;
    color: white !important;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.report-update {
    display: inline-block;
    margin-top: 8px;
    margin-left: 8px;
    padding: 8px 12px;
    border: 1px solid #217a32;
    color: #217a32;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.rv-type-filters button.active {
    background: #217a32;
    color: white;
    border-color: #217a32;
    font-weight: bold;
}

.route-box {
    margin-top: 10px;
    padding: 12px;
    background: #f4f6f4;
    border-radius: 12px;
}

.route-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.route-row input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 14px;
    box-sizing: border-box;
}

.route-distance {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.route-distance button {
    flex: 1;
    padding: 8px;
    border: 1px solid #bbb;
    border-radius: 18px;
    background: white;
    font-weight: 700;
    cursor: pointer;
}

.route-distance button.active {
    background: #217a32;
    color: white;
    border-color: #217a32;
}

.route-button {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: #217a32;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
    
.legend-paw {
    display: inline-flex;
    width: 26px;
    height: 26px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: white;
    font-size: 16px;
    margin-right: 6px;
}

.green-paw {
    background: #218a3a;
}

.yellow-paw {
    background: #e2a520;
}

.red-paw {
    background: #cf3f3f;
}

.legend-you {
    display: inline-block;
    width: 18px;
    height: 18px;
    background: #2b7de9;
    border: 3px solid white;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(43,125,233,.35);
    margin-right: 8px;
    vertical-align: middle;
}

.controls-hidden .search-row,
.controls-hidden .route-box,
.controls-hidden .filters {
    display: none;
}

.toggle-controls {
    float: right;
    margin: 6px 12px 6px 0;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
}
    
</style>
</head>

<header>

    <div class="route-row">

    </div>

    <div class="route-distance">

        <button data-miles="10">10 MI</button>
    </div>

    <button class="route-button" id="findRouteBtn">

</div>

    <div class="filters">
        <div class="filter" id="nearMeBtn">NEAR ME</div>
        <div class="filter active" data-filter="free">FREE</div>
        <div class="filter" data-filter="offleash">OFF-LEASH</div>
        <div class="filter" data-filter="lighted">LIGHTED</div>
        <div class="filter" data-filter="separated">SMALL/LARGE</div>
        <div class="filter" data-filter="travelstop">TRAVEL STOP</div>
        <div class="filter" data-filter="rv">RV/VAN</div>
    </div>

    <div id="rvTypeFilters" class="rv-type-filters" style="display:none;">
    <button data-rvtype="parkingVanClassB">VAN/CLASS B</button>
    <button data-rvtype="parkingClassC">CLASS C</button>
    <button data-rvtype="parkingClassA">CLASS A</button>
    <button data-rvtype="parkingPullBehind">PULL-BEHIND</button>
    <button data-rvtype="parkingSemi">SEMI</button>
</div>

</header>
    
    <button id="toggleControls" class="toggle-controls">HIDE CONTROLS</button>

<div id="map"></div>

<div class="legend">
    <div><span class="legend-paw green-paw">🐾</span> Confirmed Free</div>

    <div><span class="legend-paw red-paw">🐾</span> Fee Required</div>
    <div><span class="legend-you"></span> You Are Here</div>
</div>

let activeFilters = {
    free: true,
    offleash: false,
    lighted: false,
    separated: false,
    travelstop: false,
    rv: false
};

let routeMiles = 5;

document.querySelectorAll(".route-distance button").forEach(button => {
    button.addEventListener("click", function() {

        document.querySelectorAll(".route-distance button")
            .forEach(btn => btn.classList.remove("active"));

        this.classList.add("active");

        routeMiles = Number(this.dataset.miles);

        if (activeRouteCoordinates) {
    renderMarkers();
}

    });
});

function createParkIcon(status) {

    let color;

    if (status === "free") {
        color = "#218a3a";
    } else if (status === "unknown") {
        color = "#e2a520";
    } else {
        color = "#cf3f3f";
    }

    return L.divIcon({
        className: "",
        html: `
            <div style="
                width: 36px;
                height: 36px;
                background: ${color};
                border: 3px solid white;
                border-radius: 50%;
                box-shadow: 0 2px 7px rgba(0,0,0,.35);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 21px;
            ">
                🐾
            </div>
        `,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
        popupAnchor: [0, -20]
    });
}

let markers = [];
    let userMarker = null;

function parkMatchesFilters(park) {
    if (activeFilters.free && park.status !== "free") return false;
    if (activeFilters.offleash && !park.offleash) return false;
    if (activeFilters.lighted && !park.lighted) return false;
    if (activeFilters.separated && !park.separated) return false;
    if (activeFilters.travelstop && park.parkType !== "Travel Stop Dog Park") return false;
    if (activeFilters.rv && !park.rv) return false;
    
    if (activeFilters.rv && activeRVType) {
    const rvSuitability = park[activeRVType];

    if (
        rvSuitability !== "Verified" &&
        rvSuitability !== "Likely suitable"
    ) return false;
}
    return true;
}
let activeRouteCoordinates = null;

function parkIsNearRoute(park) {

    if (!activeRouteCoordinates) return true;

    const parkPoint = L.latLng(park.lat, park.lng);
    let closestDistance = Infinity;

    activeRouteCoordinates.forEach(coord => {

        const routePoint = L.latLng(coord[0], coord[1]);
        const distance = parkPoint.distanceTo(routePoint);

        if (distance < closestDistance) {
            closestDistance = distance;
        }

    });

    const milesFromRoute = closestDistance / 1609.344;

    console.log(park.name, milesFromRoute);

     return milesFromRoute <= routeMiles;
}
function renderMarkers() {
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];

    parks.forEach(function(park) {

        if (!parkMatchesFilters(park)) return;
        if (!parkIsNearRoute(park)) return;

        const directions =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(park.name + " " + park.location);

        let popup = `
    <div class="park-name">${park.name}</div>
    <p class="status">${park.statusLabel}</p>
    <p>Type: ${park.parkType || "Unknown"}</p>
    <p><strong>📍 ${park.location}</strong></p>

    <p>${park.offleash ? "✓ Off-leash" : "Leash rules: Unknown"}</p>
    <p>${park.fenced ? "✓ Fenced" : "Fencing: Unknown"}</p>
    <p>Small/Large: ${
        park.separated === true ? "Separate areas" : 
        park.separated === false ? "No separate areas" : "Unknown"
    }</p>
    
    <p>Water: ${park.water || "Unknown"}</p>
    <p>Waste Bags: ${park.wasteBags || "Unknown"}</p>
    <p>Parking: ${park.parking || "Unknown"}</p>
        ${park.parkingVanClassB ? `<p>🚐 Van/Class B: ${park.parkingVanClassB}</p>` : ""}
        ${park.parkingClassC ? `<p>🚍 Class C: ${park.parkingClassC}</p>` : ""}
        ${park.parkingClassA ? `<p>🚌 Class A: ${park.parkingClassA}</p>` : ""}
        ${park.parkingPullBehind ? `<p>🛻 Pull-behind: ${park.parkingPullBehind}</p>` : ""}
    <p>Hours: ${park.hours || "Unknown"}</p>

        ${park.accessNote ? `<p><strong>Access:</strong> ${park.accessNote}</p>` : ""}
        ${park.seasonalClosure ? `<p><strong>⚠️ Seasonal Closure:</strong> ${park.seasonalClosure}</p>` : ""}
    
    <p>Last Verified: ${park.lastVerified || "Not yet verified"}</p>
    <p>Source: ${
    park.sourceUrl
        ? `<a href="${park.sourceUrl}" target="_blank" rel="noopener noreferrer">${park.source || "Official source"}</a>`
        : (park.source || "Source pending")
}</p>

<p class="source-note">
    Check official source for current park rules, restrictions & closures.
</p>
    
    <a class="directions"
       href="${directions}"
       target="_blank">
       DIRECTIONS
    </a>
    
    <a class="report-update"
href="mailto:updates@freedogparks.com?subject=${encodeURIComponent(`Dog Park Update: ${park.name}`)}&body=${encodeURIComponent(`What changed?

Fee/free status:
Hours:
Water:
Waste bags:
Parking/RV access:
Lighting:
Small/Large separation:
Other notes:`)}"

   target="_blank">
   REPORT AN UPDATE
    </a>
`;

        const marker = L.marker(
    [park.lat, park.lng],
    { icon: createParkIcon(park.status) }
)
    .addTo(map)
    .bindPopup(popup);

        markers.push(marker);
    });
    
    if (markers.length > 0 && !activeRouteCoordinates) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds(), {
        padding: [40, 40],
        maxZoom: 11
    });
}
}

document.querySelectorAll(".filter").forEach(function(button) {
    button.addEventListener("click", function() {

        const filterName = button.dataset.filter;

        activeFilters[filterName] = !activeFilters[filterName];
        button.classList.toggle("active");
        
if (filterName === "rv") {
    const rvTypeFilters = document.getElementById("rvTypeFilters");
    rvTypeFilters.style.display = activeFilters.rv ? "flex" : "none";

    if (!activeFilters.rv) {
    activeRVType = null;

    document.querySelectorAll("#rvTypeFilters button")
        .forEach(btn => btn.classList.remove("active"));
    }
}

        renderMarkers();
    });
});

let activeRVType = null;

document.querySelectorAll("#rvTypeFilters button").forEach(function(button) {
    button.addEventListener("click", function() {

        const rvType = button.dataset.rvtype;

        if (activeRVType === rvType) {
            activeRVType = null;
            button.classList.remove("active");
        } else {
            document.querySelectorAll("#rvTypeFilters button")
                .forEach(btn => btn.classList.remove("active"));

            activeRVType = rvType;
            button.classList.add("active");
        }

        renderMarkers();
    });
});

document.getElementById("destinationBtn")
    .addEventListener("click", searchDestination);

document.getElementById("destinationInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            searchDestination();
        }
    });

let routeLine = null;

document.getElementById("findRouteBtn")
    .addEventListener("click", async function() {

        const from = document.getElementById("routeFrom").value.trim();
        const to = document.getElementById("routeTo").value.trim();

        if (!from || !to) {
            alert("Please enter both a starting point and destination.");
            return;
        }

        try {

            const geocodePlace = async (place) => {
                const response = await fetch(
                    "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
                    encodeURIComponent(place)
                );

                const results = await response.json();

                if (results.length === 0) {
                    throw new Error("Location not found: " + place);
                }

                return {
                    lat: parseFloat(results[0].lat),
                    lng: parseFloat(results[0].lon)
                };
            };

            const start = await geocodePlace(from);
            const end = await geocodePlace(to);

            const routeResponse = await fetch(
                `https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`
            );

            const routeData = await routeResponse.json();

            if (!routeData.routes || routeData.routes.length === 0) {
                throw new Error("No driving route found.");
            }

            const coordinates =
                routeData.routes[0].geometry.coordinates.map(coord => [
                    coord[1],
                    coord[0]
                ]);

            activeRouteCoordinates = coordinates;

            if (routeLine) {
                map.removeLayer(routeLine);
            }

            routeLine = L.polyline(coordinates, {
                weight: 5,
                opacity: 0.8
            }).addTo(map);

            renderMarkers();

            map.fitBounds(routeLine.getBounds(), {
                padding: [30, 30]
            });

        } catch (error) {
            alert("I couldn't create that route. Please check the locations and try again.");
            console.error(error);
        }

    });

async function searchDestination() {

    const query =
        document.getElementById("destinationInput").value.trim();

    if (!query) {
        alert("Enter a city or destination.");
        return;
    }

    try {

        const response = await fetch(
            "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
            encodeURIComponent(query)
        );

        const results = await response.json();

        if (results.length === 0) {
            alert("I couldn't find that destination.");
            return;
        }

        const lat = parseFloat(results[0].lat);
        const lng = parseFloat(results[0].lon);

        map.setView([lat, lng], 11);

        L.popup()
            .setLatLng([lat, lng])
            .setContent("<b>" + results[0].display_name + "</b>")
            .openOn(map);

    } catch (error) {
        alert("Destination search isn't available right now.");
    }
}

renderMarkers();
    document.getElementById("nearMeBtn").addEventListener("click", function() {

    if (!navigator.geolocation) {
        alert("Location services are not supported by this browser.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {

            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;

            if (userMarker) {
                map.removeLayer(userMarker);
            }

            const userIcon = L.divIcon({
    className: "",
    html: `
        <div style="
            width: 22px;
            height: 22px;
            background: #2b7de9;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(43,125,233,.35),
                        0 2px 8px rgba(0,0,0,.3);
        "></div>
    `,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
});

userMarker = L.marker([userLat, userLng], { icon: userIcon })
    .addTo(map)
    .bindPopup("<b>You are here</b>")
    .openPopup();

            let nearestPark = null;
            let nearestDistance = Infinity;

            parks.forEach(function(park) {

                if (!parkMatchesFilters(park)) return;

                const distance = map.distance(
                    [userLat, userLng],
                    [park.lat, park.lng]
                );

                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    nearestPark = park;
                }
            });

            if (nearestPark) {

                const bounds = L.latLngBounds([
                    [userLat, userLng],
                    [nearestPark.lat, nearestPark.lng]
                ]);

                map.fitBounds(bounds, {
                    padding: [60, 60],
                    maxZoom: 11
                });

                const miles = nearestDistance / 1609.344;

                alert(
                    "Nearest matching park: " +
                    nearestPark.name +
                    "\\nApproximately " +
                    miles.toFixed(1) +
                    " miles away."
                );

            } else {
                alert("No parks match your current filters.");
            }
        },

        function() {
            alert("I couldn't access your location. Please allow location access and try again.");
        },

        {
            enableHighAccuracy: true,
            timeout: 10000
        }
    );
});
