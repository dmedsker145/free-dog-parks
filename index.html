<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Dog Parks</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
}

header {
    background: white;
    padding: 14px 18px 12px;
    border-bottom: 1px solid #ddd;
}

h1 {
    margin: 0;
    color: #217a32;
    font-size: 25px;
}

.subtitle {
    color: #666;
    font-size: 13px;
    margin-top: 3px;
}

.filters {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    overflow-x: auto;
}

.filter {
    border: 1px solid #bbb;
    border-radius: 20px;
    padding: 7px 13px;
    background: white;
    white-space: nowrap;
    font-weight: 600;
    cursor: pointer;
}

.filter.active {
    background: #217a32;
    color: white;
    border-color: #217a32;
}

#map {
    height: calc(100vh - 120px);
    width: 100%;
}

.legend {
    position: absolute;
    right: 15px;
    top: 140px;
    z-index: 1000;
    background: white;
    padding: 10px 13px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    font-size: 13px;
}

.legend div {
    margin: 4px 0;
}

.dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 7px;
}

.green { background: #218a3a; }
.yellow { background: #e2a520; }
.red { background: #cf3f3f; }

.park-name {
    font-size: 17px;
    font-weight: bold;
}

.status {
    font-weight: bold;
}

.directions {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    background: #217a32;
    color: white !important;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>🐾 FREE DOG PARKS</h1>
    <div class="subtitle">
        V1 Prototype • Northeastern Indiana
    </div>

    <div class="filters">
        <div class="filter" id="nearMeBtn">NEAR ME</div>
        <div class="filter active" data-filter="free">FREE</div>
        <div class="filter" data-filter="offleash">OFF-LEASH</div>
        <div class="filter" data-filter="lighted">LIGHTED</div>
        <div class="filter" data-filter="separated">SMALL/LARGE</div>
        <div class="filter" data-filter="rv">RV/VAN</div>
    </div>
</header>

<div id="map"></div>

<div class="legend">
    <div><span class="dot green"></span>Confirmed Free</div>
    <div><span class="dot yellow"></span>Needs Verification</div>
    <div><span class="dot red"></span>Fee Required</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([41.18, -85.12], 9);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

const parks = [
    {
    name: "Buth Field Dog Park",
    lat: 43.1608,
    lng: -85.7076,
    status: "free",
    statusLabel: "🟢 CONFIRMED FREE",
    offleash: true,
    lighted: false,
    separated: true,
    rv: false,
    info: "Off-leash • Fully fenced • Separate small & large dog areas • Waste station • Seasonal water",
    location: "Sparta, Michigan"
},

{
    name: "Crump's Canine Corral",
    lat: 41.3658,
    lng: -85.2386,
    status: "free",
    statusLabel: "🟢 CONFIRMED FREE",
    offleash: true,
    lighted: false,
    separated: false,
    rv: false,
    info: "FREE • Off-leash dog park",
    location: "Avilla, Indiana"
},
{
    name: "Pawster Park Pooch Playground",
    lat: 41.03874,
    lng: -85.16335,
    status: "fee",
    statusLabel: "🔴 FEE REQUIRED",
    offleash: true,
    lighted: false,
    separated: false,
    rv: false,
    info: "Pooch Pass required • Off-leash • Fenced",
    location: "Fort Wayne, Indiana"
},
{
    name: "Camp Canine",
    lat: 41.11290,
    lng: -85.11760,
    status: "fee",
    statusLabel: "🔴 FEE REQUIRED",
    offleash: true,
    lighted: false,
    separated: false,
    rv: false,
    info: "Off-leash • Fenced • Drinking fountains",
    location: "Fort Wayne, Indiana"
},
{
    name: "Thomas Park Dog Park",
    lat: 41.37156,
    lng: -85.05313,
    status: "unknown",
    statusLabel: "🟡 NEEDS VERIFICATION",
    offleash: true,
    lighted: false,
    separated: true,
    rv: false,
    info: "Off-leash • Fenced • Separate small & large dog areas",
    location: "Auburn, Indiana"
}
];

let activeFilters = {
    free: true,
    offleash: false,
    lighted: false,
    separated: false,
    rv: false
};

let markers = [];
    let userMarker = null;

function parkMatchesFilters(park) {
    if (activeFilters.free && park.status !== "free") return false;
    if (activeFilters.offleash && !park.offleash) return false;
    if (activeFilters.lighted && !park.lighted) return false;
    if (activeFilters.separated && !park.separated) return false;
    if (activeFilters.rv && !park.rv) return false;
    return true;
}

function renderMarkers() {
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];

    parks.forEach(function(park) {

        if (!parkMatchesFilters(park)) return;

        const directions =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(park.name + " " + park.location);

        const popup = `
            <div class="park-name">${park.name}</div>
            <p class="status">${park.statusLabel}</p>
            <p>${park.info}</p>
            <p>${park.location}</p>

            <a class="directions"
            href="${directions}"
            target="_blank">
            DIRECTIONS
            </a>
        `;

        const marker = L.marker([park.lat, park.lng])
            .addTo(map)
            .bindPopup(popup);

        markers.push(marker);
    });
    
    if (markers.length > 0) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds(), {
        padding: [40, 40],
        maxZoom: 11
    });
}
}

document.querySelectorAll(".filter").forEach(function(button) {
    button.addEventListener("click", function() {

        const filterName = button.dataset.filter;

        activeFilters[filterName] = !activeFilters[filterName];

        button.classList.toggle("active");

        renderMarkers();
    });
});

renderMarkers();
    document.getElementById("nearMeBtn").addEventListener("click", function() {

    if (!navigator.geolocation) {
        alert("Location services are not supported by this browser.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {

            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;

            if (userMarker) {
                map.removeLayer(userMarker);
            }

            userMarker = L.marker([userLat, userLng])
                .addTo(map)
                .bindPopup("<b>You are here</b>")
                .openPopup();

            let nearestPark = null;
            let nearestDistance = Infinity;

            parks.forEach(function(park) {

                if (!parkMatchesFilters(park)) return;

                const distance = map.distance(
                    [userLat, userLng],
                    [park.lat, park.lng]
                );

                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    nearestPark = park;
                }
            });

            if (nearestPark) {

                const bounds = L.latLngBounds([
                    [userLat, userLng],
                    [nearestPark.lat, nearestPark.lng]
                ]);

                map.fitBounds(bounds, {
                    padding: [60, 60],
                    maxZoom: 11
                });

                const miles = nearestDistance / 1609.344;

                alert(
                    "Nearest matching park: " +
                    nearestPark.name +
                    "\\nApproximately " +
                    miles.toFixed(1) +
                    " miles away."
                );

            } else {
                alert("No parks match your current filters.");
            }
        },

        function() {
            alert("I couldn't access your location. Please allow location access and try again.");
        },

        {
            enableHighAccuracy: true,
            timeout: 10000
        }
    );
});

</script>

</body>
</html>
